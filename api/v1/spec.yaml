openapi: 3.0.0
info:
  title: Contree API
  description: |
    Contree is a container management system combining virtual machine isolation with container operational efficiency. 
    Designed for security-sensitive workloads requiring hardware-enforced boundaries while maintaining
    container workflow compatibility.
  version: 1.0.0

servers:
  - url: '{baseUrl}/v1'
    description: |
      Nebius IAM-fronted endpoint (use `IAMBearerAuth` + `IAMProjectHeader`).
      Override `baseUrl` to point at a different deployment.
    variables:
      baseUrl:
        default: https://api.tokenfactory.nebius.com/sandboxes
        description: |
          Base URL of the contree service. Defaults to the public Nebius
          IAM-fronted endpoint; set to your self-hosted contree origin
          (e.g. `https://contree.example.com`) when running elsewhere.

tags:
  - name: images
    description: Operations related to container images
  - name: files
    description: Operations related to file uploads
  - name: instances
    description: Operations related to container instances
  - name: inspect
    description: Operations related to inspecting container images
  - name: operations
    description: Operations related to long-running operations
  - name: auth
    description: Authentication and token introspection

paths:
  /images:
    get:
      summary: List publicly available images
      description: |
        Returns a list of all publicly available container images.
      operationId: listImages
      tags:
        - images
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: |
            Maximum number of images to return. Must be between 1 and 1000.
            Default is 100. Invalid values raise 400 error.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: |
            Number of images to skip before starting to collect the result set.
            Default is 0. Invalid values raise 400 error.
        - name: tagged
          in: query
          required: false
          schema:
            type: string
            description: |
              If not `0` only images with tags will be listed. May be avoided or set to `0` to list all images.
              If no value is provided (like `?tagged`, it is considered as `1`.
          example: "1"
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: |
              A valid image tag prefix to filter images by this prefix. Only images with tags starting with. Implies `tagged` parameter.
          example: "ubuntu"
        - name: uuid
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UUIDSchema'
          description: Filter images by UUID
        - $ref: '#/components/parameters/SinceParameter'
        - $ref: '#/components/parameters/UntilParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /images/{imageUUID}/tag:
    delete:
      summary: Remove tags from an image
      description: |
        Removes a tag (or all tags) from an image.

        When `tag` query parameter is provided, only that specific tag is removed.
        When omitted, all tags are removed from the image.

        If any public image has the same tag, tag will start tracking that public image again.

        In all other cases tag will be removed and the image will be accessible only by its UUID.
      operationId: deleteImageTag
      tags:
          - images
      parameters:
        - name: imageUUID
          in: path
          required: true
          description: The UUID of the image to untag
          schema:
              $ref: '#/components/schemas/UUIDSchema'
        - name: tag
          in: query
          required: false
          description: >
            The tag to remove. If omitted, all tags are removed from the image.
          schema:
            type: string
            example: busybox:latest
      responses:
          '204':
            description: Tags removed successfully
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
    patch:
      summary: Add a tag to an image
      description: |
        Adds a tag to an image. Tags are unique per namespace; if the requested tag is already
        assigned to another image, it will be moved to this image.

        Assigning a tag that matches a public tag to a public image will freeze that tag
        to the current image - subsequent public updates to the tag will not affect it.
        To make the public tag track the latest public image again, remove your tag assignment.
        
        When a tag is removed from an image that resides in the public namespace, the API returns HTTP 200 OK.
        response body contains the tag that now points to the public image
        (i.e., the image that the tag is automatically re‑assigned to).

        In other words, un‑tagging a public image does not delete the tag; it simply moves the tag back to the public
        image and the caller receives that tag in the successful response.
      operationId: updateImageTag
      tags:
        - images
      parameters:
        - name: imageUUID
          in: path
          required: true
          description: The UUID of the image to update
          schema:
            $ref: '#/components/schemas/UUIDSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tag
              properties:
                tag:
                  type: string
                  description: New tag for the image
                  example: busybox:latest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /images/import:
    post:
      summary: Import a container image from a registry
      description: |
        Imports the OCI image filesystem content of from a specified registry.

        Important limitations and behavior:
        
        - Only the image root filesystem (files and directories) is imported. This is like to the output of
          `docker export` and does not preserve layers metadata.
        - Most image configuration and manifest data are ignored. Metadata such as `LABEL`,
          `ENTRYPOINT`, `CMD`, `WORKDIR`, `EXPOSE` and other image configuration directives
          will **NOT be imported or applied**.
        - `ENV` variables defined in the image **are imported** and automatically applied to the
          instance environment when `shell` is set to `true`. When `shell` is `false`, image
          environment variables are not inherited and must be passed explicitly via the `env` field.
        - The result is a flat rootfs snapshot with preserved environment variables.
        - If the specified tag already exists in the public images, the imported image will replace it.
          To avoid this, you can tag the existing image with a different tag for use it later.
          You also can use image UUIDs it is not changing for imported and existend image.
        - In case the remote image is unchanged and already imported, the operation will complete and the same UUID
          will be returned without re-importing the image.

        The request creates an import operation which runs asynchronously.
      operationId: importImage
      tags:
        - images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageImportRequest'
      responses:
        '201':
          description: Created - The request has been accepted for processing
          headers:
            Location:
              schema:
                type: string
              description: URL to check the operation status
              example: /v1/operations/12345678-9abc-baba-deda-0123456789ab
          content:
            application/json:
              schema:
                type: object
                required:
                  - uuid
                properties:
                  uuid:
                    $ref: '#/components/schemas/UUIDSchema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /files:
    post:
      summary: Upload a file to the server. the body must be a file content.
      description: Uploads a file to the server. The body must contain the file content.
      operationId: uploadFile
      tags:
        - files
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Created - The file has been successfully uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: List uploaded files for the current namespace
      description: Returns a paginated list of uploaded files for the current namespace.
      tags:
        - files
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
          description: Maximum number of files to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of files to skip
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter files created after this time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter files created before this time
      responses:
        '200':
          description: List of uploaded files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /files/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        description: SHA256 hash of the file (64 hex characters)
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
    head:
      summary: Check if a file exists for the current namespace
      description: Returns 200 if the file is uploaded by the current namespace, otherwise 404.
      operationId: checkFileExists
      tags:
        - files
      responses:
        '200':
          description: OK - The file exists
        '401':
          description: Unauthorized - Invalid or missing authentication credentials
        '403':
          description: Forbidden - Token does not have sufficient permissions
        '404':
          description: Not Found - The file does not exist
    get:
      summary: Get file info by SHA256
      description: Returns file info (uuid, sha256, created_at, updated_at).
      tags:
        - files
      responses:
        '200':
          description: File info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /instances:
    post:
      summary: Spawn a new container instance
      description: |
        Creates and runs a new execution instance with the specified configuration. 
        Requires a valid `Authorization` header.
        
        Common request body rules:

          * The request body must contain at least `command` and `image` fields all other fields can be omitted.
          * If the `command` field is a shell expression, you must set `shell` field to `true`.
          * For specifying the shell binary, you can use `env` field to set `SHELL` variable.
          * When `shell` is `true`, environment variables defined in the image (via `ENV` directives) are
            automatically inherited. When `shell` is `false`, image environment variables are not inherited
            and must be passed explicitly via the `env` field.
      operationId: spawnInstance
      tags:
        - instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceSpawnRequest'
      responses:
        '201':
          description: >
            Created - The instance has been successfully created and its execution has been queued.
            When operation created successfully, the response will contain `Location` header with URL to check the operation status.
            and the body will contain the parsed request body with additional `uuid` field.
          headers:
            Location:
              schema:
                type: string
              description: URL to check the operation status
              example: /v1/operations/12345678-9abc-baba-deda-0123456789ab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSpawnResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations:
    get:
      summary: List operations
      description: Returns a list of running and completed operations
      operationId: listOperations
      tags:
        - operations
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: |
            Maximum number of operations to return. Must be between 1 and 1000.
            Default is 100. Invalid values raise 400 error.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: |
            Number of operations to skip before starting to collect the result set.
            Default is 0. Invalid values raise 400 error.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ PENDING, EXECUTING, SUCCESS, FAILED, CANCELLED, ASSIGNED ]
          description: Filter operations by their state
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [ image_import, instance ]
          description: Filter operations by their kind
        - $ref: '#/components/parameters/SinceParameter'
        - $ref: '#/components/parameters/UntilParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/{operationId}:
    get:
      summary: Get an operation status
      description: |
        Returns the status of an operation.

        For an EXECUTING INSTANCE operation, pass `?inflight=1` to
        also synthesize the partial `result.stdout` / `result.stderr`
        from the live event log.  Off by default — each fetch with
        `inflight` triggers an extra subscribe RPC to the guest and
        drains its current events.gz, which is wasted work for
        clients that only poll for status transitions.
      operationId: getOperationStatus
      tags:
        - operations
      parameters:
        - name: operationId
          in: path
          required: true
          description: The ID of the operation
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - name: inflight
          in: query
          required: false
          allowEmptyValue: true
          description: |
            HTTP-flag boolean.  Present without a value (`?inflight`)
            and `?inflight=1` both enable; `?inflight=0` and absence
            disable.  When enabled and the operation is EXECUTING
            INSTANCE, partial stdout/stderr is synthesized from the
            live event log and attached under `result`.
          schema:
            type: string
            enum: ["", "0", "1"]
            default: "0"
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              schema:
                type: integer
              description: Recommended time in seconds to wait before the next status check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Cancel an operation
      description: Cancels an operation
      operationId: cancelOperation
      tags:
        - operations
      parameters:
        - name: operationId
          in: path
          required: true
          description: The ID of the import operation to cancel
          schema:
            $ref: '#/components/schemas/UUIDSchema'
      responses:
        '202':
          description: Accepted - The cancellation request has been accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /operations/{operationId}/events:
    get:
      summary: Stream the operation event log via Server-Sent Events
      description: |
        Always returns `text/event-stream` (SSE) on success.  The body
        is a sequence of three kinds of lines (per RFC W3C SSE), each
        terminated by `\n\n`:

        ### Frame shapes

        **Normal event frame** — one `OperationEvent` JSON object in
        `data:`, dispatchable via `event:`:
        ```
        id: <integer event.id>
        event: <OperationEventType, e.g. stdout|stderr|spawn|exit>
        data: {"id": N, "ts": "...", "spid": ..., "type": "...", "data": {...}}
        ```
        `event:` always matches `data.type`.  See `OperationEvent` and
        `OperationEventType` for the per-type payload shape.  Native
        `EventSource` dispatches each frame to the matching
        `addEventListener("<type>", ...)` handler.

        **Server-side error frame** — surfaces handler exceptions to
        the connected client without tearing the TCP connection down
        mid-stream.  Sent right before the server closes the response:
        ```
        : stream ended with error, retry since last event id

        event: sse_error
        data: <one-line exception message>
        ```
        The leading SSE comment line lets pure-EventSource clients see
        the intent ("retry from Last-Event-Id"); the `sse_error` frame
        carries the error text for logging.  Clients should treat this
        as a non-clean close and reconnect with the standard SSE
        `Last-Event-Id` semantics (see Resuming).

        **Keepalive comment** — periodic `: keepalive\n\n` lines
        emitted while the stream is idle.  They keep upstream
        `proxy_read_timeout` / TCP idle timers fresh and have no
        application meaning.  Spec-compliant; EventSource and any SSE
        parser must ignore comment lines (those beginning with `:`).

        ### `follow` semantics

        The `follow` parameter controls only whether the stream stays
        open after the last currently-known event:

          * `follow=0` (default) — the server emits everything
            currently available and closes the connection.
          * `follow=1` — same start; if the operation is still
            running the server keeps the connection open and forwards
            new events as they appear.  For terminal operations
            `follow=1` is a no-op: there's nothing more to subscribe
            to, so the connection closes after the last event just
            like `follow=0`.

        Optional filters:

          * `?spid=N` — only events whose `spid` (Spawned Process ID,
            the routing identity in `OperationEvent`) matches.
          * `?since=N` — only events with `id > N`.

        `follow=1` requires `SPAWN` or `SPAWN_DISPOSABLE` on top of
        the baseline `LIST` — a long-lived subscription reserves
        per-operation server state.  `follow=0` is read-only and
        stays under `LIST`.

        ### Resuming after a drop

        Every normal frame carries `id:` — the canonical event id.
        On reconnect send the last successfully received id in the
        standard `Last-Event-Id` request header (or `?since=N` on
        manual GETs); the server resumes from that point.

        ### Error handling

        | Status | Meaning                                          | Client action                                |
        |--------|--------------------------------------------------|----------------------------------------------|
        | 200    | Stream open                                      | Read frames; reconnect with Last-Event-Id if the stream closes before reaching a terminal event |
        | 400    | Malformed query/header (non-integer param)       | Fix request                                  |
        | 401    | Missing/invalid auth                             | Refresh credentials                          |
        | 403    | Auth lacks LIST (or SPAWN for `follow=1`)        | Use a token with the right scope             |
        | 404    | Operation not in this namespace                  | Wrong UUID                                   |
        | 410    | Stream is over but the terminal artifact isn't ready yet | Retry after `Retry-After`                    |
        | 425    | Not yet ready (operation is still being prepared)| Retry after `Retry-After`                    |
        | 502    | Upstream returned an error opening the stream    | Retry; if persistent, escalate               |
        | 504    | Upstream took too long to respond                | Retry                                        |

        A `200` followed by an `event: sse_error` frame and immediate
        close is the in-band equivalent of "the stream broke after we
        already committed to a 200" — handle it the same way as 410:
        wait briefly, reconnect with `Last-Event-Id`.

        See `OperationEvent` for the per-event shape.
      operationId: getOperationEvents
      tags:
        - operations
      parameters:
        - name: operationId
          in: path
          required: true
          description: The ID of the operation
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - name: follow
          in: query
          required: false
          allowEmptyValue: true
          description: |
            HTTP-flag boolean.  Present without a value (`?follow`)
            and `?follow=1` both enable; `?follow=0` and absence
            disable.  When enabled, the SSE stream stays open after
            the currently-known events have been sent — for a
            running operation new events are forwarded as they
            appear; for a terminal operation it has no effect.
          schema:
            type: string
            enum: ["", "0", "1"]
            default: "0"
        - name: spid
          in: query
          required: false
          description: |
            Only emit events whose `spid` field matches.  Filter is
            applied server-side regardless of whether the operation is
            still running or already terminal.
          schema:
            type: integer
            minimum: 0
        - name: since
          in: query
          required: false
          description: |
            Only emit events with `id > since` (event IDs are
            monotonically increasing).  Overridden by the
            `Last-Event-Id` header when present.
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-Id
          in: header
          required: false
          description: |
            Standard SSE resume header sent automatically by
            `EventSource` on reconnect.  Treated as `?since=N`;
            takes precedence over the query param.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: |
            OK — `text/event-stream` body.  Normal events,
            `: keepalive` comments, and a terminal `event: sse_error`
            frame may all appear; see endpoint description.  With
            `follow=0` (or any terminal operation) the response ends
            after the last available event; with `follow=1` on a
            still-running operation the connection stays open until the
            client disconnects or the operation reaches a terminal
            state.
          headers:
            Content-Type:
              schema:
                type: string
                enum: [text/event-stream]
            Cache-Control:
              schema:
                type: string
                enum: [no-cache]
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/OperationEventStream'
              examples:
                ordered_lifecycle:
                  summary: "SSE frames for a tiny successful run"
                  value: |
                    : keepalive

                    id: 0
                    event: init
                    data: {"id":0,"ts":"2026-06-08T20:00:00Z","spid":0,"type":"init","data":{"init_pid":1}}

                    id: 1
                    event: spawn
                    data: {"id":1,"ts":"2026-06-08T20:00:00.10Z","spid":1,"type":"spawn","data":{"pid":4242}}

                    id: 2
                    event: exit
                    data: {"id":2,"ts":"2026-06-08T20:00:00.12Z","spid":1,"type":"exit","data":{"pid":4242,"code":0}}
                broken_mid_stream:
                  summary: |
                    Stream that committed to 200 but then hit a
                    server-side error.  Reconnect with `Last-Event-Id: 1`.
                  value: |
                    id: 0
                    event: init
                    data: {"id":0,"ts":"2026-06-08T20:00:00Z","spid":0,"type":"init","data":{"init_pid":1}}

                    id: 1
                    event: spawn
                    data: {"id":1,"ts":"2026-06-08T20:00:00.10Z","spid":1,"type":"spawn","data":{"pid":4242}}

                    : stream ended with error, retry since last event id

                    event: sse_error
                    data: upstream event source closed unexpectedly
        '400':
          description: |
            Bad request — a query parameter failed to parse as an
            integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: |
            Gone — the live stream is finished but the terminal
            artifact isn't durable yet.  Reconnect after the
            `Retry-After` delay; the subsequent request will deliver
            the full event log.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                finalizing:
                  summary: "Live stream over, terminal artifact still being committed"
                  value:
                    status: 410
                    error: "operation finished; events not yet durable"
        '425':
          description: |
            Too Early (RFC 8470) — the operation isn't streamable yet.
            It may still be queued, or just starting up.  Retry after
            `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pre_attach:
                  summary: "Operation accepted but events not yet flowing"
                  value:
                    status: 425
                    error: "events not yet available for operation ..."
                pending_budget_exhausted:
                  summary: "Operation still queued past the server's wait budget"
                  value:
                    status: 425
                    error: "Events not yet available; retry shortly."
        '502':
          description: |
            Bad Gateway — an upstream component returned an error
            opening the event source.  Retry after a short delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: |
            Gateway Timeout — an upstream component didn't respond
            within the server-side deadline.  Idempotent on this
            endpoint — retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /operations/{operationId}/subprocesses:
    post:
      summary: Spawn an additional subprocess inside a running instance
      description: |
        Starts a new process inside the VM that already hosts the named
        operation.  Distinct from `POST /instances`, which spins up a
        VM: this endpoint requires a running operation (EXECUTING or
        ASSIGNED) and reuses the existing VM.

        The body is an `ExecSpec` — process-execution fields only.
        VM-level concerns (`image`, `hostname`,
        `files`, `timeout`, `disposable`, `preserve_env`) are not
        accepted here; they were set when the parent operation was
        created.

        `resources_limits.cpu` and `resources_limits.memory_mib` use the
        same names and units as operation creation. Each omitted or null
        subprocess limit inherits the corresponding operation limit.
        Values above the operation limit return 400. Limits apply at
        launch: memory_mib sets RLIMIT_AS for each process and memory.max
        for the entire process tree. They cannot be changed through this
        API. Guest root can modify limits; these limits do not
        provide security isolation between processes in one VM.

        The required permission follows the parent instance:
        `SPAWN_DISPOSABLE` when it was spawned with `disposable=true`,
        `SPAWN` otherwise.

        On success the worker assigns a fresh `spid` (≥2; `spid=1` is
        the main process spawned from `metadata`) and the response
        carries it in the body plus a `Location` header pointing at
        `GET /operations/{operationId}/subprocesses/{spid}` — the
        subprocess result reconstructed from its events.
      operationId: operationSubprocessCreate
      tags:
        - operation
      parameters:
        - name: operationId
          in: path
          required: true
          description: The ID of the operation
          schema:
            $ref: '#/components/schemas/UUIDSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecSpec'
      responses:
        '201':
          description: |
            Created — subprocess started.  `Location` references the
            new subprocess result.
          headers:
            Location:
              schema:
                type: string
              description: URL of the new subprocess result.
              example: /v1/operations/01J.../subprocesses/2
          content:
            application/json:
              schema:
                type: object
                required: [spid]
                properties:
                  spid:
                    type: integer
                    minimum: 2
                    description: Spawn id assigned by the worker.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflict — the operation exists but is not an instance, or
            is not currently EXECUTING / ASSIGNED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '425':
          description: |
            Too Early (RFC 8470) — the VM is not ready to accept the
            exec yet: no worker holds the operation, or the guest
            control channel is still coming up.  Retry after
            `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
        '504':
          description: |
            Gateway Timeout — the guest accepted the connection but the
            spawn call didn't return in time.  The subprocess MAY have
            started anyway; do not blind-retry — inspect
            `GET /events` for a `spawn` event first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /operations/{operationId}/subprocesses/{spid}:
    get:
      summary: Result of one subprocess, reconstructed from its events
      description: |
        Returns an `InstanceResult` for `spid` — the same shape as the
        parent operation's `metadata.result` — folded from the
        subprocess's event log (spawn / stdout / stderr / exit).
        Works for running and terminal operations alike.  While the
        process is still running, `state.exit_code` and `state.signal`
        are `-1` (unknown) and `resources` holds sentinel defaults;
        once the exit event lands they carry the real values.

        `stdout` / `stderr` are consolidated and capped at the spec's
        `truncate_output_at`.  The raw event stream stays available at
        `GET /operations/{operationId}/events?spid={spid}`.
      operationId: operationSubprocess
      tags:
        - operation
      parameters:
        - name: operationId
          in: path
          required: true
          description: The ID of the operation
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - in: path
          name: spid
          required: true
          schema:
            type: integer
            minimum: 1
          description: Spawn id (1 = main process; ≥2 = exec'd children).
      responses:
        '200':
          description: Result of the requested subprocess.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: |
            Not Found — the operation does not exist, its event log has
            no `spawn` event for that spid, or the operation was
            CANCELLED (events are dropped for cancelled operations).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '425':
          description: |
            Too Early — the event source is not reachable yet (no
            worker holds the operation, or events.gz is not uploaded).
            Retry after `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer

    delete:
      summary: Kill one subprocess
      description: |
        Sends a signal to the process group of `spid` inside the
        running instance.  Without the `signal` parameter the group
        gets SIGKILL.  Termination is observable, not returned: the
        `exit` event lands in the event log and
        `GET /operations/{operationId}/subprocesses/{spid}` reports
        the terminal `state` (`signal` set, `exit_code` -1 when killed).

        Killing `spid=1` (the main process) effectively ends the
        operation, like letting the command fail.
      operationId: operationSubprocessKill
      tags:
        - operation
      parameters:
        - name: operationId
          in: path
          required: true
          description: The ID of the operation
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - in: path
          name: spid
          required: true
          schema:
            type: integer
            minimum: 1
          description: Spawn id (1 = main process; ≥2 = exec'd children).
        - in: query
          name: signal
          required: false
          schema:
            type: string
          description: |
            Signal to send instead of SIGKILL — a number (`15`) or a
            name with or without the SIG prefix (`TERM`, `SIGTERM`).
          example: SIGTERM
      responses:
        '204':
          description: Signal delivered to the subprocess's process group.
        '400':
          description: Invalid spid or unknown `signal` value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not Found — the operation does not exist, or the worker has
            no live process with that spid (never spawned or already
            exited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Conflict — the operation exists but is not an instance, or
            is not currently EXECUTING / ASSIGNED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '425':
          description: |
            Too Early — no worker holds the operation yet.  Retry after
            `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer

  /operations/{operationId}/subprocesses/{spid}/stdin:
    post:
      summary: Write to a subprocess's stdin and/or close it
      description: |
        Writes a chunk to the stdin of a live process inside the
        running instance — `spid=1` targets the main process, `≥2` the
        exec'd children.  Requires the process to have been started
        with `stdin.close=false`; otherwise its pipe is already at EOF
        and the call returns 409.

        `close=true` (the default) signals EOF after writing `value`;
        an empty `value` with `close=true` just closes the pipe.  A
        client that serializes its own requests gets ordered writes;
        concurrent requests to the same spid are safe but their order
        is unspecified.

        A 504 means the guest write timed out mid-call — the chunk may
        or may not have been delivered (e.g. the process stopped
        reading and the pipe is full), so blind retries can duplicate
        data.
      operationId: operationSubprocessStdin
      tags:
        - operation
      parameters:
        - name: operationId
          in: path
          required: true
          description: The ID of the operation
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - in: path
          name: spid
          required: true
          schema:
            type: integer
            minimum: 1
          description: Spawn id (1 = main process; ≥2 = exec'd children).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosableStreamRepr'
      responses:
        '204':
          description: Chunk written (and/or stdin closed).
        '400':
          description: Invalid spid or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not Found — the operation does not exist, or the worker has
            no live process with that spid (never spawned or already
            exited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Conflict — the operation is not a running instance, or the
            process's stdin is already closed (spawned without
            `close=false`, closed by an earlier request, or the process
            exited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: |
            Gone — the instance finished; there is no live process to
            write to.
        '425':
          description: |
            Too Early — no worker holds the operation yet, or the
            control channel is not up.  Retry after `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
        '501':
          description: |
            Not Implemented — the instance runs a guest image that
            predates stdin streaming.
        '504':
          description: |
            Gateway Timeout — the guest write did not complete in time;
            the chunk may or may not have been written.  Not safe to
            retry blindly.

  /operations/{operation_uuid}/files:
    post:
      summary: Apply an uploaded file to a running instance
      operationId: applyInstanceFile
      tags:
        - operations
      description: |
        Reads a file previously uploaded through POST /files and writes it to a
        running INSTANCE operation, including disposable instances. Requires LIST
        and the permission used to start the instance. Both the operation and the
        uploaded file must belong to the request namespace. Expired files are unavailable.
        The assigned worker streams the stored object to the guest through RPC.
        Init records request metadata in `inspect` events and the terminal
        publication result in `file_upload`, including `file_uuid` and byte count.
        File contents do not enter operation events.

        With unpack omitted or false, path is the full destination filename.
        Missing parent directories are created. The file is published atomically after
        transfer and SHA256 verification. The new file has mode 0644 and is
        owned by the guest runtime user. With replace true, an existing leaf symlink is replaced.
        Directories and special files are not regular file destinations.

        With unpack true, path is the destination directory. Supports tar,
        tar.gz and tar.bz2; compression is detected from the stored bytes. Xz is
        unsupported and rejected before subsequent chunks are sent. Without unpack,
        compressed archives are copied unchanged. Content-Type describes this JSON
        request and never controls extraction.

        Extraction accepts regular files, directories, symlinks and hardlinks to
        regular files already extracted in the staging tree. Parent symlinks inside that tree are
        not followed. Absolute entry names and entries containing '..' are rejected.
        procfs, sysfs, devices, FIFOs and sockets are unsupported. New directories
        have mode 0755; regular files retain tar permission bits (0777). Ownership
        and timestamps are not restored. Other entries fail explicitly.
        With replace omitted or false, any existing destination returns 409, including
        a symlink or empty directory. This condition is checked again atomically at publication.
        replace true permits an existing destination. With merge omitted or false,
        directory replacement removes the entire old tree without merging contents.

        Archives are extracted into a temporary sibling directory. The destination
        remains unchanged until the complete stream and SHA256 have been verified.
        Without merge, publication uses an atomic rename or exchange, then removes the old tree.
        Root and mount-point replacement are unavailable. Existing open descriptors
        can still refer to old inodes; concurrent workload access is not a snapshot.

        merge true requires both unpack true and replace true. After complete staging
        and verification, it combines directories and atomically replaces individual
        files and symlinks. Existing entries absent from the archive remain. Destination
        directory symlinks are not followed; directory/file conflicts fail explicitly.
        Same-filesystem hardlinks are retained. Crossing a destination mount requires
        copying file bytes and does not preserve hardlinks across filesystems.
        Merge is not atomic for the whole tree: errors, cancellation or timeout after
        application starts can leave completed changes. These changes are not rolled back.

        Returns 204 only after completion. Transfers have a 300-second deadline
        and bounded buffers and handles. Disconnect or VM exit cancels the transfer.
        A lost response can leave an uncertain outcome; requests are not replayed
        automatically. This endpoint does not write to a completed result image.

        A transfer timeout does not stop the instance. Before publication or merge starts, cancellation
        preserves the old destination and removes the temporary file or extraction tree.
        A timeout while awaiting the final response can occur after publication;
        it does not prove that no changes were made. An old-tree cleanup failure is
        reported as an error after publication; it does not roll back the new tree.
        The uploaded source object retains its normal lifetime. Automatically created
        parent directories have mode 0755 and can remain after errors.

        The primary command's timeout follows normal instance finalization: ordinary
        instances persist their filesystem, including successfully published uploads;
        disposable instances do not. Instance shutdown waits for pending upload cleanup.
        A timeout or crash of the execution environment can bypass this cleanup and does not produce
        a successfully persisted result image through normal finalization.
      parameters:
        - name: operation_uuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_uuid, path]
              properties:
                file_uuid:
                  $ref: '#/components/schemas/UUIDSchema'
                path:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: Absolute guest filename, or directory when unpack is true. Missing parents are created.
                unpack:
                  type: boolean
                  default: false
                  description: Extract tar, tar.gz or tar.bz2 instead of copying the stored bytes.
                replace:
                  type: boolean
                  default: false
                  description: Permit an existing destination. Without merge, directories are replaced in full.
                merge:
                  type: boolean
                  default: false
                  description: Merge verified archive contents. Requires unpack and replace. Can leave partial changes.
            example:
              file_uuid: 799ba70b-911c-4fdd-97ea-da10910b94bd
              path: /workspace
              unpack: true
      responses:
        '204':
          description: File write or archive extraction completed.
        '400':
          description: Invalid JSON fields, UUID, damaged archive, or merge without both unpack and replace.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permission or inaccessible guest path.
        '404':
          description: Operation, uploaded file, stored object, or required directory not found.
        '409':
          description: Operation is not INSTANCE, destination exists without replace, or destination cannot be replaced.
        '410':
          description: Instance has exited.
        '415':
          description: Request Content-Type must be application/json.
        '422':
          description: Invalid path, unsupported file type, archive entry, or compression.
        '425':
          description: Instance filesystem is not ready.
        '429':
          description: Guest transfer resource limit reached.
        '501':
          description: Guest runtime does not support file writes.
        '502':
          description: Guest or storage transfer failed, or stored file integrity check failed.
        '503':
          description: Assigned worker is unavailable.
        '504':
          description: Transfer timed out.
        '507':
          description: Guest has insufficient space or quota.

  /operations/{operation_uuid}/inspect/download:
    get:
      summary: Download a file from a running instance
      description: |
        Reads through guest RPC without recording file contents in operation events.
        Requires LIST and the permission used to start this instance (SPAWN or
        SPAWN_DISPOSABLE). Reads include tmpfs and additional mounts visible to
        the guest runtime. procfs, sysfs, devices, sockets, and FIFOs are unavailable.
        Reads do not form a snapshot. The opened inode and initial size are used;
        later growth is excluded. Truncation or VM exit interrupts the response.
        A transfer has a 300-second deadline. No result-image fallback is performed.
      operationId: inspectInstanceDownload
      tags:
        - inspect
      parameters:
        - name: operation_uuid
          in: path
          required: true
          description: The UUID of the running instance to inspect
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - name: path
          in: query
          required: true
          allowReserved: true
          schema:
            type: string
          description: The path of the file to inspect inside the running instance, e.g. `/etc/hosts`
        - name: text
          in: query
          required: false
          allowEmptyValue: true
          schema:
            type: boolean
          description: If present (with or without value), returns text/plain format instead of JSON
          example: ""
      responses:
        '409':
          description: The operation is not an instance, or the file changed before streaming began.
        '502':
          description: Guest inspection failed.
        '503':
          description: The worker is unavailable.
        '410':
          description: The instance has exited. No image fallback is performed.
        '425':
          description: The instance filesystem is not ready.
        '429':
          description: The guest inspection resource limit was reached.
        '501':
          description: The guest runtime does not support live inspection.
        '504':
          description: Guest inspection timed out.
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found - The file does not exist in the running instance or running instance does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - The specified path is not a file inside the running instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    head:
      summary: Check if a file exists in running instance
      description: Checks if a file exists in the specified running instance without returning the file content
      operationId: checkInstanceFile
      tags:
        - inspect
      parameters:
        - name: operation_uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "12345678-9abc-baba-deda-0123456789ab"
          description: The UUID of the running instance to inspect
        - name: path
          in: query
          required: true
          allowReserved: true
          schema:
            type: string
          description: The path of the file to check inside the running instance, e.g. `/etc/hosts`
      responses:
        '409':
          description: The operation is not an instance, or the file changed before streaming began.
        '502':
          description: Guest inspection failed.
        '503':
          description: The worker is unavailable.
        '410':
          description: The instance has exited. No image fallback is performed.
        '425':
          description: The instance filesystem is not ready.
        '429':
          description: The guest inspection resource limit was reached.
        '501':
          description: The guest runtime does not support live inspection.
        '504':
          description: Guest inspection timed out.
        '200':
          description: OK - The file exists in the running instance
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized - Invalid or missing authentication credentials
        '403':
          description: Forbidden - Token does not have sufficient permissions
        '404':
          description: Not Found - The file does not exist in the running instance or running instance does not exist
        '422':
          description: Unprocessable Entity - The specified path is not a file inside the running instance


  /operations/{operation_uuid}/inspect/list:
    get:
      summary: List files in running instance
      description: |
        Lists guest files without recording contents in operation events.
        Requires LIST and the permission used to start this instance.
        Reads do not form a snapshot. A directory can contain at most 10000 entries.
        procfs and sysfs cannot be listed.
      operationId: inspectInstanceFile
      tags:
        - inspect
      parameters:
        - name: operation_uuid
          in: path
          required: true
          description: The UUID of the running instance to inspect
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - name: path
          in: query
          required: true
          allowReserved: true
          description: The path of the directory to inspect inside the running instance
          schema:
            type: string
            example: "/etc"
        - name: text
          in: query
          required: false
          allowEmptyValue: true
          schema:
            type: boolean
          description: If present (with or without value), returns text/plain format instead of JSON
          example: ""
      responses:
        '409':
          description: The operation is not an instance, or the file changed before streaming began.
        '502':
          description: Guest inspection failed.
        '503':
          description: The worker is unavailable.
        '410':
          description: The instance has exited. No image fallback is performed.
        '425':
          description: The instance filesystem is not ready.
        '429':
          description: The guest inspection resource limit was reached.
        '501':
          description: The guest runtime does not support live inspection.
        '504':
          description: Guest inspection timed out.
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryList'
            text/plain:
              schema:
                type: string
                description: ls-like output format
                example: |
                  total 19.42 KB
                  drwxr-xr-x 1 0 0   858.00 May 30 12:13 bin
                  drwxr-xr-x 1 0 0        0 May 30 12:13 dev
                  drwxr-xr-x 1 0 0   540.00 May 30 12:13 etc
                  drwxr-xr-x 1 0 0        0 May 30 12:13 home
                  drwxr-xr-x 1 0 0   146.00 May 30 12:13 lib
                  drwxr-xr-x 1 0 0    28.00 May 30 12:13 media
                  drwxr-xr-x 1 0 0        0 May 30 12:13 mnt
                  drwxr-xr-x 1 0 0        0 May 30 12:13 opt
                  dr-xr-xr-x 1 0 0        0 May 30 12:13 proc
                  drwx------ 1 0 0        0 May 30 12:13 root
                  drwxr-xr-x 1 0 0     8.00 May 30 12:13 run
                  drwxr-xr-x 1 0 0   790.00 May 30 12:13 sbin
                  drwxr-xr-x 1 0 0        0 May 30 12:13 srv
                  drwxr-xr-x 1 0 0        0 May 30 12:13 sys
                  drwxrwxrwt 1 0 0        0 May 30 12:13 tmp
                  drwxr-xr-x 1 0 0    40.00 May 30 12:13 usr
                  drwxr-xr-x 1 0 0    86.00 May 30 12:13 var
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found - The file does not exist in the running instance or running instance does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - The specified path could not be listed inside the running instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /operations/{operation_uuid}/inspect/archive:
    get:
      summary: Download a file or a directory from running instance as tar archive
      description: |
        Streams the specified path inside the running instance root filesystem as a POSIX PAX
        tar archive. A directory becomes the archive root; a regular file becomes
        a single-entry archive. The response is chunked; total size is not known
        upfront. Served as an attachment, `filename` is the path with `/` replaced
        by `_` plus `.tar` (e.g. `/bin/true` -> `bin_true.tar`).
        Requires LIST and the permission used to start this instance.
        Contents do not enter operation events. Reads do not form a snapshot.
        Traversal skips procfs and sysfs and preserves descendant symlinks.
        File changes or VM exit can interrupt the stream. Transfers have a
        300-second deadline.
      operationId: inspectInstanceArchive
      tags:
        - inspect
      parameters:
        - name: operation_uuid
          in: path
          required: true
          description: The UUID of the running instance to inspect
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - name: path
          in: query
          required: true
          allowReserved: true
          schema:
            type: string
          description: The path of the file or directory to archive inside the running instance, e.g. `/etc`
      responses:
        '409':
          description: The operation is not an instance, or the file changed before streaming began.
        '502':
          description: Guest inspection failed.
        '503':
          description: The worker is unavailable.
        '410':
