  /operations/{operation_uuid}/inspect/grep:
    get:
      summary: Search file contents in running instance
      description: |
        Regex content search inside the running instance's root filesystem, through guest RPC.
        A Go converter translates supported Rust regex syntax to Go regexp.

        Symlinks are never followed during traversal, hidden files are searched,
        `.ignore` and `.gitignore` rules within each search root are respected.
        A NUL byte in the first 64 KiB causes a file to be skipped; a later NUL
        ends that file's search. Go regexp uses linear-time matching.
        The classes \w/\W, \d/\D, and \s/\S use Unicode semantics.
        Unicode properties and case folding are pinned to Unicode 16.0.0, matching the image engine.
        Scoped flags, nested class set operations, and bounded expansion of large repetitions are supported.
        Expanded patterns share a 1 MiB limit per request. Unsupported syntax returns 400 with a pattern
        index and byte offset. Unicode \b/\B, CRLF mode, non-ASCII byte mode, and \Q…\E are rejected.
        Use (?-u:\b) for an ASCII word boundary. Smart case examines parsed literals.

        Results are a flat, file-ordered list of lines. `before`/`after` request extra
        `type: context` lines around each `type: match` line, mirroring ripgrep's
        --json message type field.

        `path` may be repeated to search multiple roots in one call, the same way
        `pattern`/`glob` already can; results are concatenated in the given order
        and share the `max_total` budget across all of them.
        Results never enter operation events. Reads are live and do not form a snapshot.
        procfs, sysfs, devices, sockets, and FIFOs are not searched.
        Requires LIST and the permission used to start this instance.
        Searches have a 10-second budget per root and permit two concurrent
        searches per instance. Reaching the time, depth, or result limit sets
        `truncated`. Context lines count towards `max_total`. Display text is
        limited to 4096 bytes per line; matching can continue beyond this window.
      operationId: inspectInstanceGrep
      tags:
        - inspect
      parameters:
        - name: operation_uuid
          in: path
          required: true
          description: The UUID of the running instance to inspect
          schema:
            $ref: '#/components/schemas/UUIDSchema'
        - name: pattern
          in: query
          required: true
          allowReserved: true
          description: Regex pattern to search for. May be repeated (max 16); patterns are OR-ed. Max 1024 characters each.
          schema:
            type: string
            example: "^PermitRootLogin"
        - name: path
          in: query
          required: false
          allowReserved: true
          description: |
            File or directory to search inside the running instance. May be repeated (max 16) to search
            multiple roots; results are concatenated in the given order, sharing max_total
            across all paths. Defaults to the rootfs root.
          schema:
            type: string
            default: "/"
            example: "/etc"
        - name: glob
          in: query
          required: false
          allowReserved: true
          description: Glob to filter files (ripgrep -g semantics, "!" negates). May be repeated.
          schema:
            type: string
            example: "*.conf"
        - name: max_count
          in: query
          required: false
          description: Maximum matches per file (hard cap 10000).
          schema:
            type: integer
            minimum: 1
            maximum: 10000
        - name: max_total
          in: query
          required: false
          description: Maximum total matches across all files (default 1000, hard cap 10000).
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
        - name: case
          in: query
          required: false
          description: Case sensitivity mode.
          schema:
            type: string
            enum: [sensitive, insensitive, smart]
            default: sensitive
        - name: before
          in: query
          required: false
          description: |
            Lines of context to include before each match (ripgrep -B semantics, hard cap 50).
            For symmetric context (grep -C n), pass both before and after yourself.
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
        - name: after
          in: query
          required: false
          description: Lines of context to include after each match (ripgrep -A semantics, hard cap 50).
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrepResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found - The path does not exist in the running instance or running instance does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: The operation is not an instance.
        '422':
          description: The path has an unsupported file type or contains a NUL character.
        '410':
          description: Instance has exited
        '425':
          description: Guest is not ready
        '429':
          description: Guest inspection resource limit reached
        '501':
          description: Guest runtime does not support inspection
        '502':
          description: Guest inspection failed
        '503':
          description: Worker unavailable
        '504':
          description: Guest inspection timed out

  /inspect/{image_uuid}/grep:
