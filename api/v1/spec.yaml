components:
  parameters:
    UntilParameter:
      name: until
      in: query
      required: false
      description: |
        **Show only results created before the given date/time or interval.**

        Accepts a Unix timestamp or interval string.

        Interval format: `600s`/`15m`/`2h`/`3d`/`1w` means 600 seconds, 15 minutes, 2 hours, 3 day, or 1 week ago respectively).

        For example:
        * `2025-01-01T12:00:00+00:00` means January 1st, 2025 at 12:00 UTC
        * `600s` means 600 seconds ago
        * `15m` means 15 minutes ago

        Invalid values raise 400 error.
      schema:
        type: string
      example: 1h
    SinceParameter:
      name: since
      in: query
      required: false
      schema:
        type: string
      example: 1w
      description: |
        **Show only results created after the given date/time or interval.**

        Accepts a Unix timestamp or interval string.

        Interval format: `600s`/`15m`/`2h`/`3d`/`1w` means 600 seconds, 15 minutes, 2 hours, 3 day, or 1 week ago respectively).

        For example:
        * `2025-01-01T12:00:00+00:00` means January 1st, 2025 at 12:00 UTC
        * `600s` means 600 seconds ago
        * `15m` means 15 minutes ago

        Invalid values raise 400 error.

  responses:
    Unauthorized:
      description: |
        Unauthorized - Invalid or missing authentication credentials.
        Either the `Authorization` bearer token is missing or invalid, or
        the `Project` header is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Forbidden - Token does not have sufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Not Found - The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Conflict - The operation cannot be completed due to a conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    IAMBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: IAM
      description: |
        IAM bearer token issued by the Nebius IAM service. Sent as
        `Authorization: Bearer <iam-token>`. Must be combined with the
        `Project` header (see `IAMProjectHeader`).

        This is the recommended authentication scheme for new clients.
    IAMProjectHeader:
      type: apiKey
      in: header
      name: Project
      description: |
        Nebius project ID associated with the IAM token. Required together
        with `IAMBearerAuth`. Identifies the project context the request is
        scoped to.

  schemas:
    UUIDSchema:
      type: string
      format: uuid
      description: A UUID string
      example: "12345678-9abc-baba-deda-0123456789ab"

    ImageSourceTag:
      type: string
      description: |
        A container image tag. String must be started with a prefix "tag:" followed by the actual tag.
      pattern: '^tag:[A-Za-z0-9][A-Za-z0-9_-]*(?:[:/.][A-Za-z0-9_-]+)*$'
      example: "tag:busybox:latest"

    ImageSource:
      oneOf:
        - $ref: '#/components/schemas/UUIDSchema'
        - $ref: '#/components/schemas/ImageSourceTag'
      description: |
        An base image for run a new instance. May be either image UUID or image tag (prefixed with "tag:").
        After creation of the instance, if tag is used, this value will be resolved to the image UUID, 
        and the UUID will be stored in the metadata.
      example: "tag:busybox:latest"

    FileItem:
      type: object
      required:
        - size
        - path
        - owner
        - group
        - mode
        - mtime
        - nlink
        - uid
        - gid
        - is_dir
        - is_regular
        - is_symlink
        - is_socket
        - is_fifo
        - symlink_to
      properties:
        size:
          type: integer
          format: int64
          description: File size in bytes
          example: 1024
        path:
          type: string
          description: File name (relative to the directory being listed)
          example: "passwd"
        owner:
          oneOf:
            - type: string
            - type: integer
          description: File owner name or UID
          example: "root"
        group:
          oneOf:
            - type: string
            - type: integer
          description: File group name or GID
          example: "root"
        uid:
          type: integer
          description: User ID of the file owner
          example: 0
        gid:
          type: integer
          description: Group ID of the file
          example: 0
        mode:
          type: integer
          description: File mode/permissions as integer (octal representation)
          example: 33188
        mtime:
          type: integer
          format: int64
          description: Last modification time as Unix timestamp
          example: 1640995200
        nlink:
          type: integer
          description: Number of hard links
          example: 1
        is_dir:
          type: boolean
          description: True if the item is a directory
          example: false
        is_regular:
          type: boolean
          description: True if the item is a regular file
          example: true
        is_symlink:
          type: boolean
          description: True if the item is a symbolic link
          example: false
        is_socket:
          type: boolean
          description: True if the item is a socket
          example: false
        is_fifo:
          type: boolean
          description: True if the item is a FIFO/named pipe
          example: false
        symlink_to:
          type: string
          description: Target path if the item is a symbolic link, empty string otherwise
          example: ""

    DirectoryList:
      type: object
      required:
        - path
        - files
      properties:
        path:
          type: string
          description: The directory path that was listed
          example: "/etc"
        files:
          type: array
          description: List of files and directories in the specified path
          items:
            $ref: '#/components/schemas/FileItem'

    GrepSubmatch:
      type: object
      required:
        - text
        - start
        - end
      properties:
        text:
          type: string
          description: The matched text
          example: "PermitRootLogin"
        start:
          type: integer
          description: Byte offset of the match start within the line
          example: 1
        end:
          type: integer
          description: Byte offset of the match end within the line
          example: 16

    GrepMatch:
      type: object
      required:
        - path
        - line_number
        - absolute_offset
        - line_text
        - line_bytes
        - submatches
        - type
      properties:
        path:
          type: string
          description: File path relative to the image rootfs
          example: "/etc/ssh/sshd_config"
        line_number:
          type: integer
          description: 1-based line number of the match
          example: 57
        absolute_offset:
          type: integer
          description: Byte offset of the line from the start of the file
          example: 1712
        line_text:
          type: string
          description: The matching line, including the line terminator (truncated at 4096 bytes)
          example: "#PermitRootLogin prohibit-password\n"
        line_bytes:
          type: integer
          description: Real byte length of the matching line; greater than line_text length when the line was capped
          example: 8192
        submatches:
          type: array
          description: Empty for context lines (they carry no submatches)
          items:
            $ref: '#/components/schemas/GrepSubmatch'
        type:
          type: string
          enum: [match, context]
          description: |
            Mirrors ripgrep's --json message type: "match" is an actual match, "context" is a
            before/after context line requested via before/after.
          example: match

    GrepResult:
      type: object
      required:
        - path
        - patterns
        - matches
        - truncated
      properties:
        path:
          type: string
          description: |
            The first path inside the image that was searched. When `path` was repeated,
            see each row's own `path` for which root it actually came from.
          example: "/etc"
        patterns:
          type: array
          description: The patterns that were searched for
          items:
            type: string
          example: ["^PermitRootLogin"]
        matches:
          type: array
          description: File-ordered lines; each is a match or (when before/after are set) surrounding context
          items:
            $ref: '#/components/schemas/GrepMatch'
        truncated:
          type: boolean
          description: True when max_total or the search deadline stopped the search early
          example: false

    ImageImportRequest:
      type: object
      required:
        - registry
      properties:
        registry:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              description: URL of the container registry
              example: docker://docker.io/busybox:latest
            credentials:
              type: object
              properties:
                username:
                  type: string
                  description: Username for the registry authentication
                  example: myuser
                password:
                  type: string
                  description: Password for the registry authentication
                  example: secret
                  format: password
        tag:
          type: string
          nullable: true
          description: Tag to identify the image when listing publicly available images. If omitted, the image will be private and only accessible by ID.
          example: busybox:latest
        timeout:
          type: integer
          description: Maximum time in seconds to wait for the import operation to complete
          default: 300
          example: 300

    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          description: List of publicly available images

    ImageImportMetadata:
      type: object
      properties:
        registry:
          type: object
          properties:
            url:
              type: string
              description: URL of the container registry
              example: docker://docker.io/busybox:latest
            credentials:
              type: object
              properties:
                username:
                  type: string
                  description: Username for the registry authentication
                  example: myuser
                password:
                  type: string
                  description: Always masked in the response is present
                  example: "<MASKED>"
        tag:
          type: string
          nullable: true
        timeout:
          type: integer
          description: Maximum time in seconds to wait for the import operation to complete
          default: 300
          example: 300

    Image:
      type: object
      properties:
        uuid:
          $ref: '#/components/schemas/UUIDSchema'
        tag:
          type: string
          nullable: true
          description: Tag to identify the image
          example: busybox:latest
        created_at:
          type: string
          description: ISO 8601 formatted timestamp of when the image was created
          example: "2024-01-01T12:00:00+00:00"
        operation_uuid:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UUIDSchema'
          description: |
            UUID of the operation that created this image.
            Returns `null` when the image belongs to a different namespace (e.g. public images)
            or when the image was not created by an operation (e.g. shared images).

    StreamRepr:
      type: object
      required:
        - value
        - encoding
      properties:
        value:
          type: string
          description: Content of the stream
          example: "Y29tbWFuZCBvdXRwdXQK"
        encoding:
          type: string
          enum: [ascii, base64]
          description: Encoding of the content
          example: "base64"
        truncated:
          type: boolean
          description: Whether the output was truncated
          example: false

    ClosableStreamRepr:
      type: object
      description: |
        Stdin payload.  Delivery to the child is always complete —
        stdin is never truncated on its way to the process.  Only the
        *recorded* `stdin` events in the subprocess event log are
        capped by `truncate_output_at`, same as stdout/stderr.  This
        schema also carries a `close` flag controlling the pipe's EOF.
      required:
        - value
      properties:
        value:
          type: string
          description: Content to write to stdin (may be empty for a close-only request)
          example: "aGVsbG8K"
        encoding:
          type: string
          enum: [ascii, base64]
          description: Encoding of the content
          default: ascii
        close:
          type: boolean
          default: true
          description: |
            `true` (default) closes stdin (EOF) after writing `value` —
            the pre-existing one-shot behavior.  `false` keeps the pipe
            open so more data can be sent later via
            `POST /operations/{operationId}/subprocesses/{spid}/stdin`.

    InstanceResourcesLimits:
      type: object
      additionalProperties: false
      description: |
        Launch-time limits. CPU sets the VM's vCPU count. memory_mib limits
        each process's address space (RLIMIT_AS, soft and hard) and the
        whole process tree's memory (cgroup memory.max). A request for
        1 MiB is valid and enforces that limit on the workload. The backend
        independently selects a minimum VM RAM allocation for guest boot,
        networking and runtime services, for example 128 or 256 MiB.
        This minimum is an implementation detail and can change. It does
        not increase the requested workload limit.
        A small address-space limit can prevent the executable or runtime
        from loading. It includes stacks, libraries and reserved mappings;
        allocations can fail with ENOMEM even with overcommit enabled.
        Guest kernel and runtime consume part of VM RAM.
        Limits are maxima, not reservations.
        Guest root retains permission to modify cgroups.
      properties:
        cpu:
          type: integer
          minimum: 1
          maximum: 4
          default: 4
          description: Number of guest vCPUs.
        memory_mib:
          type: integer
          minimum: 1
          maximum: 8192
          default: 4096
          description: Per-process address-space and process-tree memory limit in MiB (1048576 bytes).
        max_layer_bytes:
          type: integer
          minimum: 1
          description: Maximum writable layer size in bytes.
          example: 1073741824
          default: 12884901888

    ProcessResourcesLimits:
      type: object
      additionalProperties: false
      description: |
        Launch-time limits for a subprocess and its descendants. Each omitted
        or null field inherits the requested operation limit, not the VM's
        minimum boot memory. CPU/RAM cannot exceed the parent operation.
        Limits are maxima, not reservations. Concurrent processes share VM
        resources and can exhaust the aggregate budget. memory_mib sets
        RLIMIT_AS (soft and hard) before exec and memory.max for the tree.
        RLIMIT_AS includes reserved mappings, stacks and libraries; allocation
        or executable loading can fail with ENOMEM. Descendants inherit it.
        A local cgroup OOM
        kills this process tree. A VM-wide OOM can affect other processes.
        Guest root retains permission to modify cgroups.
      properties:
        cpu:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4
          description: >
            Number of guest vCPUs available to the process tree. The runtime
            selects CPU affinity; CPU sets can overlap between subprocesses.
        memory_mib:
          type: integer
          nullable: true
          minimum: 1
          maximum: 8192
          description: Per-process RLIMIT_AS and tree memory.max in MiB. Swap is disabled for this group.

    InstanceNetworking:
      type: object
      properties:
        enabled:
          type: boolean
          description: >
            Enable network access for the instance. When `false`, the VM starts without
            a guest network interface.
          default: true

    ExecSpec:
      type: object
      description: |
        Process-execution surface shared between `InstanceSpawnRequest`
        (the main process) and
        `POST /operations/{operationId}/subprocesses` (additional
        subprocesses).  VM-level concerns (image, hostname,
        disk limits, files, timeout, disposable, preserve_env)
        live on `InstanceSpawnRequest` only.
      required:
        - command
      properties:
        resources_limits:
          $ref: '#/components/schemas/ProcessResourcesLimits'
        command:
          type: string
          description: >
            The command to execute.  Same semantics as in
            `InstanceSpawnRequest.command` — when `shell=true` it is a
            shell expression, otherwise a path to an executable.
          example: /bin/app
        args:
          type: array
          items:
            type: string
          description: Arguments to pass to the command if shell is set to false.
          example: [arg1, arg2]
          default: []
        shell:
          type: boolean
          description: Run command through a shell expression (args must be empty).
          default: false
        env:
          nullable: true
          type: object
          additionalProperties:
            type: string
          description: Environment variables to set in the child process.
        cwd:
          type: string
          pattern: "^((/[^/]*)+/?)?$"
          description: Working directory; empty string means image / server default.
          default: ""
        uid:
          type: integer
          minimum: 0
          default: 0
          description: User ID to run the process as.
        gid:
          type: integer
          minimum: 0
          default: 0
          description: Group ID to run the process as.
        stdin:
          allOf:
            - $ref: '#/components/schemas/ClosableStreamRepr'
          description: |
            Bytes fed to the child's stdin — honored for both the main
            process and exec'd subprocesses.  With `close=false` the
            pipe stays open and more data can be written via
            `POST /operations/{operationId}/subprocesses/{spid}/stdin`.
        truncate_output_at:
          type: integer
          description: |
            Maximum number of bytes to keep per stream (stdout,
            stderr, and stdin) in the subprocess event log.  Does not
            affect delivery to the child — stdin is always delivered
            in full regardless of this cap.  Defaults to 1 MiB; capped
            at 10 MiB.
          default: 1048576
          example: 65535

    InstanceSpawnRequest:
      type: object
      required:
        - command
        - image
      properties:
        command:
          type: string
          description: >
            The command to execute. In case if `shell` is set to `true`, this MUST contain
            shell expression. 
            
            For example `echo hello world` or `ls -l /app`. 
            
            If `shell` is set to `false`, this must be a relative or absolute path to the executable inside the
            image rootfs. 
            
            For example: `/bin/app` or `/usr/bin/find`.
            
            Do not forget pass necessary `PATH` variable to env field, by default `PATH` is set to 
            `/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin`.
          example: /bin/app
        disposable:
          type: boolean
          description: Creates a disposable execution environment no any state will be saved.
          default: false
        hostname:
          type: string
          description: Hostname to set when execution.
          example: container-name
          default: linuxkit
        image:
          $ref: '#/components/schemas/ImageSource'
        args:
          type: array
          items:
            type: string
          description: >
            Arguments to pass to the command if shell is set to false.
          example: [arg1, arg2]
          default: []
        shell:
          type: boolean
          description: >
            Whether to run the command through a shell. If `true`, the command must be a shell expression and all
            values from args will be ignored. If `false`, the command field must be a path to an executable and
            args will be used. When `true`, environment variables from the image are automatically inherited.
            When `false`, they are not - use the `env` field to pass them explicitly.
          default: false
        env:
          nullable: true
          type: object
          additionalProperties:
            type: string
          description: >
            Environment variables to set in the container. These are merged with image-defined
            variables when `shell` is `true`. When `shell` is `false`, only variables specified
            here are available - image-defined variables are not inherited.
          example:
            KEY1: value1
            KEY2: value2
        preserve_env:
          type: boolean
          description: >
            Preserve environment variables in resulting image after execution.
            When `true`, the image's existing environment variables from `metadata/env` are merged
            with user-provided `env` values (user values take priority on conflicts), and the
            combined result is written back to `metadata/env` after command execution.
            Setting a variable to an empty string or `null` removes it from the preserved environment.
          default: false
        preserve_cwd:
          type: boolean
          description: >
            Save the resolved initial working directory as the default in the resulting image.
            An empty or omitted `cwd` resolves to the image's current workdir, or `/` if none exists.
            The metadata file is opened for writing only when its contents differ from the new value.
            Directory changes made by the command do not change the saved value.
            Requires `disposable: false` to retain the metadata in a resulting image.
          default: false
        cwd:
          type: string
          pattern: "^((/[^/]*)+/?)?$"
          description: >
            Path to the working directory, must be absolute or a special value the empty string.
            It means the default working directory of the image or server default will be used.
            If field is omitted it will be set to the empty string.
            The directory will be created automatically if it does not exist.
          example: /app
          default: ""
        uid:
          type: integer
          minimum: 0
          description: User ID to run the process as.
          example: 0
          default: 0
        gid:
          type: integer
          minimum: 0
          description: Group ID to run the process as.
          example: 0
          default: 0
        resources_limits:
          $ref: '#/components/schemas/InstanceResourcesLimits'
        networking:
          $ref: '#/components/schemas/InstanceNetworking'
        stdin:
          $ref: '#/components/schemas/ClosableStreamRepr'
        timeout:
          type: integer
          description: Maximum execution time in seconds
          example: 60
        truncate_output_at:
          type: integer
          description: >
            Maximum number of bytes to keep per stream (stdout,
            stderr, and stdin) in the subprocess event log.
            Does not affect stdin delivery to the child, which always
            receives the complete stream regardless of this cap.
            Default is `1048576` (1 MiB).
            The maximum value is `10485760` (10 MiB).
          example: 65535
          default: 1048576
        files:
          type: object
          description: Map of absolute file paths to file metadata
          additionalProperties:
            type: object
            properties:
              uuid:
                $ref: '#/components/schemas/UUIDSchema'
              uid:
                type: integer
                description: User ID
                example: 0
              gid:
                type: integer
                description: Group ID
                example: 0
              mode:
                type: string
                description: File mode in octal format (e.g., "0644")
                example: "0644"
          example:
            /root/hello.txt:
              uuid: "a9165a5d-5c86-4bd8-8ee4-ae46c19cf45d"
              uid: 0
              gid: 0
              mode: "0644"
            /tmp/log.txt:
              uuid: "065def2a-e977-4852-8b26-a0ec05e85a90"
              uid: 1000
              gid: 1000
              mode: "0600"

    InstanceSpawnResponse:
      type: object
      properties:
        uuid:
          $ref: '#/components/schemas/UUIDSchema'
        command:
          type: string
        image:
          $ref: '#/components/schemas/UUIDSchema'
        hostname:
          type: string
        args:
          type: array
          items:
            type: string
        shell:
          type: boolean
        env:
          nullable: true
          type: object
          additionalProperties:
            type: string
        preserve_env:
          type: boolean
        cwd:
          type: string
        uid:
          type: integer
        gid:
          type: integer
        resources_limits:
          $ref: '#/components/schemas/InstanceResourcesLimits'
        networking:
          $ref: '#/components/schemas/InstanceNetworking'
        stdin:
          $ref: '#/components/schemas/ClosableStreamRepr'
        timeout:
          type: integer
        truncate_output_at:
          type: integer
        disposable:
          type: boolean
        files:
          type: object
          additionalProperties:
            type: object
            properties:
              uuid:
                $ref: '#/components/schemas/UUIDSchema'
              uid:
                type: integer
              gid:
                type: integer
              mode:
                type: string
        result:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InstanceResult'

    OperationSummary:
      type: object
      properties:
        uuid:
          $ref: '#/components/schemas/UUIDSchema'
        kind:
          type: string
          description: Type of the operation
          enum: [ image_import, instance ]
        status:
          type: string
          enum: [ PENDING, ASSIGNED, EXECUTING, SUCCESS, FAILED, CANCELLED ]
          description: Current state of the instance operation
          example: success
        error:
          type: string
          nullable: true
          description: Error message if the operation failed
          example: "Container image not found"
        created_at:
          type: string
          description: ISO 8601 formatted timestamp when the operation was created
          example: "2024-01-01T12:00:00+00:00"
        duration:
          type: number
          nullable: true
          description: Operation duration in seconds
        image_size:
          type: integer
          nullable: true
          description: |
            Bytes written for the resulting image/layer(s).
            `null` when not measured (e.g. disposable instance, non-SUCCESS operations).
        consumed_cpu:
          type: number
          nullable: true
          description: |
            Total CPU time consumed by the operation, in seconds.
            `null` when not measured.
        consumed_memory:
          type: integer
          nullable: true
          description: |
            Peak resident memory used by the operation's execution environment, in KiB.
            `null` when not measured. Shared resident pages are included.
        image_uuid:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UUIDSchema'
          description: |
            UUID of the source image this operation was run on.
            Set for INSTANCE operations, `null` for IMAGE_IMPORT.
        result_image_uuid:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UUIDSchema'
          description: |
            UUID of the image produced by this operation.
            Only set for completed (SUCCESS) operations, `null` otherwise.

    InstanceResult:
      type: object
      description: Result of an instance execution
      properties:
        resources:
          type: object
          properties:
            block_input:
              type: integer
              description: Block input operations
            block_output:
              type: integer
              description: Block output operations
            cost:
              type: number
              format: float
              description: Operation cost
            elapsed_time:
              type: number
              description: Elapsed wall time
            involuntary_switches:
              type: integer
              description: Number of involuntary context switches
            max_rss:
              type: integer
              description: Maximum resident set size in KB
            monotonic_time:
              type: number
              format: float
              description: Monotonic time measurement
            page_faults:
              type: integer
              description: Number of page faults
            page_faults_io:
              type: integer
              description: Number of page faults requiring I/O
            shared_memory:
              type: integer
              description: Shared memory size
            signals:
              type: integer
              description: Number of signals received
            swaps:
              type: integer
              description: Number of swaps
            system_cpu_time:
              type: number
              format: float
              description: System CPU time used
            unshared_memory:
              type: integer
              description: Unshared memory size
            user_cpu_time:
              type: number
              format: float
              description: User CPU time used
            voluntary_switches:
              type: integer
              description: Number of voluntary context switches
        state:
          type: object
          properties:
            continued:
              type: boolean
              description: Whether the process was continued from a stop
            core_dump:
              type: boolean
              description: Whether a core dump was generated
            exit_code:
              type: integer
              description: Process exit code
            pid:
              type: integer
              description: Process ID
            signal:
              type: integer
              description: Signal that caused termination, if any
            stopped:
              type: boolean
              description: Whether the process was stopped
            timed_out:
              type: boolean
              description: Whether process had been killed because operation timeout was reached
            oom_killed:
              type: boolean
              default: false
              description: Whether an OOM kill was observed in the process tree's cgroup.
        stdout:
          $ref: '#/components/schemas/StreamRepr'
        stderr:
          $ref: '#/components/schemas/StreamRepr'

    OperationInstanceMetadata:
      allOf:
        - $ref: '#/components/schemas/InstanceSpawnRequest'
        - type: object
          description: Metadata for an instance execution operation, including request parameters and result
          properties:
            image:
              $ref: '#/components/schemas/UUIDSchema'
            result:
              $ref: '#/components/schemas/InstanceResult'

    OperationMetadata:
      oneOf:
        - $ref: '#/components/schemas/OperationInstanceMetadata'
        - $ref: '#/components/schemas/ImageImportMetadata'
      description: Metadata specific to the operation type

    OperationResponse:
      type: object
      properties:
        uuid:
          $ref: '#/components/schemas/UUIDSchema'
        kind:
          type: string
          description: Type of the operation
          enum: [ image_import, instance ]
        status:
          type: string
          enum: [ PENDING, ASSIGNED, EXECUTING, SUCCESS, FAILED, CANCELLED ]
        error:
          type: string
          nullable: true
        created_at:
          type: string
          description: ISO 8601 formatted timestamp when the operation was created
          example: "2024-01-01T12:00:00+00:00"
        duration:
          type: number
          nullable: true
        image_size:
          type: integer
          nullable: true
          description: |
            Bytes written for the resulting image/layer(s).
            `null` when not measured (e.g. disposable instance, non-SUCCESS operations).
        consumed_cpu:
          type: number
          nullable: true
          description: |
            Total CPU time consumed by the operation, in seconds.
            `null` when not measured.
        consumed_memory:
          type: integer
          nullable: true
          description: |
            Peak resident memory used by the operation's execution environment, in KiB.
            `null` when not measured. Shared resident pages are included.
        image_uuid:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UUIDSchema'
          description: |
            UUID of the source image this operation was run on.
            Set for INSTANCE operations, `null` for IMAGE_IMPORT.
        result_image_uuid:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UUIDSchema'
          description: |
            UUID of the image produced by this operation.
            Only set for completed (SUCCESS) operations, `null` otherwise.
        metadata:
          $ref: '#/components/schemas/OperationMetadata'
        result:
          type: object
          description: Result of the operation, if any
          properties:
            image:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/UUIDSchema'
            tag:
              type: string
              nullable: true
              description: Tag assigned to the imported image
              example: busybox:latest

    Error:
      type: object
      required:
        - error
      properties:
        error:
          oneOf:
            - type: string
            - type: object
            - type: array
              items:
                type: object
          description: Error message or structured validation errors
          example: "Some error occurred, this is an example of error message"
        status:
          type: integer
          description: HTTP status code
          example: 500
        traceback:
          type: array
          items:
            type: string
    FileResponse:
      type: object
      required:
        - uuid
        - sha256
        - size
      properties:
        uuid:
          $ref: '#/components/schemas/UUIDSchema'
        sha256:
          type: string
          description: SHA256 hash of the file content
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        size:
          type: integer
          format: int64
          description: File size in bytes; -1 if unknown
          example: 1024

    File:
      type: object
      required:
        - uuid
        - sha256
        - size
        - created_at
        - updated_at
      properties:
        uuid:
          $ref: '#/components/schemas/UUIDSchema'
        sha256:
          type: string
          description: SHA256 hash of the file content
        size:
          type: integer
          format: int64
          description: File size in bytes; -1 if unknown
          example: 1024
        created_at:
          type: string
          format: date-time
          description: When the file was first uploaded by this namespace
        updated_at:
          type: string
          format: date-time
          description: Updated on each upload of the same file

    FilesListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'

    WhoAmIResponse:
      type: object
      required:
        - token_uuid
        - token_expiration
        - permissions
        - operations_stat
      properties:
        token_uuid:
          type: string
          description: UUID of the authentication token
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        token_expiration:
          type: integer
          nullable: true
          description: Token expiration time as Unix timestamp, or null if not set
          example: 1735689600
        permissions:
          type: object
          additionalProperties:
            type: boolean
          description: |
            Map of all known permission names to their granted status.
            Keys are permission names (e.g., `import`, `spawn`, `list`),
            values indicate whether the token has the permission.
          example:
            import: true
            spawn: true
            spawn_disposable: false
            list: true
            cancel: false
            set_image_tag: false
        limits:
          type: object
          additionalProperties:
            type: integer
          description: Map of resource limit names to their values for the current token.
          example:
            instance_max_timeout: 3600
            instance_max_concurrency: 10
            images_import_max_concurrency: 5
            images_import_max_timeout: 3600
        operations_stat:
          type: object
          additionalProperties:
            type: integer
          description: Operation statistics (reserved for future use)

    # ------------------------------------------------------------
    # Event log schemas
    # ------------------------------------------------------------
    # GET /operations/{operationId}/events returns SSE; each frame
    # carries one OperationEvent JSON in its `data:` field.
    # ------------------------------------------------------------

    OperationEventStream:
      type: string
      format: binary
      description: |
        SSE response body for `GET /operations/{operationId}/events`.
        Wire format: a sequence of `\n\n`-separated frames; each frame
        is an [`OperationEventSSEFrame`](#/components/schemas/OperationEventSSEFrame).

        OpenAPI doesn't have first-class SSE support, so this content
        is typed as binary at the protocol level — but the per-frame
        contract is the linked schema.  Clients should parse frame by
        frame and either dispatch on the `event:` line (e.g. via
        native `EventSource`) or JSON-decode the `data:` payload.

    OperationEventSSEFrame:
      type: object
      description: |
        One SSE frame in the `/events` stream.  Three categories:

          * **Normal event** — `event:` carries the
            [`OperationEventType`](#/components/schemas/OperationEventType),
            `id:` carries the monotonic event id, `data:` carries the
            full [`OperationEvent`](#/components/schemas/OperationEvent)
            JSON.
          * **Server error** — `event: sse_error`, `data:` is a
            plain-text exception message (NOT JSON).  Pairs with a
            preceding `: stream ended with error, retry since last
            event id` comment line.
          * **Keepalive comment** — `: keepalive` (no `event:`/`id:`/`data:`).
            Discardable.

        This object is the abstract description of what one frame can
        carry; the wire is line-oriented text per the SSE spec.
      properties:
        id:
          type: integer
          format: int64
          description: |
            Monotonic event id.  Present on normal event frames; absent
            on `sse_error` and keepalive frames.
        event:
          type: string
          description: |
            On a normal frame this matches `data.type` and the
            `OperationEventType` enum.  On a transport error this is
            the literal `sse_error`.
        data:
          oneOf:
            - $ref: '#/components/schemas/OperationEvent'
            - type: string
              description: |
                Plain-text exception message (only for `event: sse_error` frames).

    OperationEvent:
      type: object
      required: [id, ts, type, data]
      description: |
        One event in the operation's event log.

        **Process events** carry a Spawned Process ID (`spid`) as
        their routing identity: `spid=0` is the daemon (init /
        network / shutdown / size_cap, plus any synthetic stderr
        emitted before a child existed), `spid=1` is the main
        process from `InstanceMetadata`, and `spid>=2` are exec'd
        children (Phase 3+).  Spids are Registry-assigned,
        monotonic, and never recycled within an operation; the
        kernel PID (when needed for debugging) lives inside the
        per-type `data` payload.

        **System events** (`completion`) describe the operation as
        a whole, not a specific child process — they omit `spid`
        entirely.
      properties:
        id:
          type: integer
          format: int64
          description: |
            Sequential id assigned at append time.  Strictly
            increasing within a single operation's event log; gaps
            are possible (rare, after a transient producer-side
            serialization failure).  Use this with `Last-Event-Id` /
            `?since=` to resume a dropped SSE stream.
          example: 42
        ts:
          type: string
          format: date-time
          description: UTC wall-clock time when the event was emitted.
          example: "2026-06-08T20:00:00.123456789Z"
        spid:
          type: integer
          minimum: 0
          description: |
            Spawned Process ID — present on process-scoped events
            (`init`, `spawn`, `stdin`, `stdout`, `stderr`, `exit`,
            `truncated`, `size_cap`, `network`, `shutdown`, `inspect`, `file_upload`).
            Absent on operation-scoped system events
            (`completion`), which don't tie to a specific child.
          example: 1
        type:
          $ref: '#/components/schemas/OperationEventType'
        data:
          description: |
            Per-type payload.  Clients should switch on `type` and
            validate `data` against the corresponding schema below.
          oneOf:
            - $ref: '#/components/schemas/EventDataInit'
            - $ref: '#/components/schemas/EventDataSpawn'
            - $ref: '#/components/schemas/EventDataStream'
            - $ref: '#/components/schemas/EventDataExit'
            - $ref: '#/components/schemas/EventDataTruncated'
            - $ref: '#/components/schemas/EventDataSizeCap'
            - $ref: '#/components/schemas/EventDataNetwork'
            - $ref: '#/components/schemas/EventDataShutdown'
            - $ref: '#/components/schemas/EventDataInspect'
            - $ref: '#/components/schemas/EventDataFileUpload'
            - $ref: '#/components/schemas/EventDataCompletion'

    OperationEventType:
      type: string
      enum:
        - init
        - spawn
        - stdin
        - stdout
        - stderr
        - exit
        - truncated
        - size_cap
        - network
        - shutdown
        - inspect
        - file_upload
        - completion
      description: |
        Lifecycle category for the event.

        System events (operation-scoped, no `spid`, always last):
          * `completion` — emitted once at terminal state.  Carries
            the final operation status, the result image uuid (if
            any), the error message (if any), and rollups for the
            log/image artifacts.  Always the last event in the log.

        Service events (always emitted, never dropped by the size
        cap):
          * `init` — emitted first; operation-level startup snapshot.
          * `spawn` — emitted when a process starts; payload is the
            spawn parameters.
          * `exit` — emitted once per process when it exits; carries
            exit code, signal, timed_out flag, and resource usage.
          * `truncated` — emitted on stream EOF if a per-stream
            byte cap was crossed during the stream's lifetime.
          * `size_cap` — emitted once if the operation's overall
            event log approached its size cap; subsequent stream
            events get dropped, service events continue.
          * `network` — per-interface counters plus the configured
            network state.  Emitted at the end of the network setup
            phase; absent for network-less operations.
          * `inspect` — guest RPC request metadata and result, with `spid=0`.
            Includes reads and writes, but never their contents.
          * `file_upload` — terminal publication result, with `spid=0`.
            Includes source UUID, destination, flags, and bytes received.
          * `shutdown` — emitted last; the operation is about to
            wind down.

        Stream events (subject to BOTH the per-stream `truncate_at`
        cap from `EventDataSpawn` AND the overall size cap):
          * `stdin` — bytes written into the process's stdin.
          * `stdout` / `stderr` — chunks the process wrote to its
            respective stream.

    EventDataInspect:
      type: object
      description: |
        Metadata for a guest inspect RPC. Init emits a started/completed pair
        with the same request_id. Event IDs order the starts independently of
        completion order. A returned handle links subsequent reads, writes,
        finish, close, and file_upload events. All events use spid=0.
        Request parameters are recorded even when the method rejects them.
        A successful open/upload only allocates a handle; it does not complete
        the transfer. Read events report RPC bytes, not HTTP client receipt.
        File contents, directory listings, and grep matches are never recorded.
        Events are flushed to the journal and bypass the stream size cap.
        A missing completion can indicate an interrupted or lost event.
        These records support a future replay implementation; replay is not automatic.
      required: [request_id, method, phase]
      oneOf:
        - required: [params]
          properties:
            phase:
              enum: [started]
        - required: [status, error]
          properties:
            phase:
              enum: [completed]
      properties:
        request_id:
          type: string
          description: Opaque identifier shared by the request and result events.
        method:
          type: string
          enum: [stat, list, open, archive, grep, read, close, upload, write, finish]
        phase:
          type: string
          enum: [started, completed]
        params:
          $ref: '#/components/schemas/EventInspectParameters'
        status:
          type: string
          enum: [success, error, cancelled, timeout]
        error:
          type: string
          nullable: true
          description: Error category only; null on success. No exception text or file contents.
        handle:
          type: string
          description: Present after a successful open, archive, grep, or upload.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes returned by a successful read.
        eof:
          type: boolean
          description: Present after a successful read; true at the end of its stream.

    EventInspectParameters:
      type: object
      description: |
        Parameters for the method named in EventDataInspect. Path methods
        (stat/list/open/archive/grep/upload) record path. Grep also records options.
        Upload records file_uuid, unpack, replace, and merge. Read/write record
        handle, offset, and size; write size is the input chunk length, not an
        acknowledgement. Close/finish record handle. Binary payloads are excluded.
      properties:
        path:
          type: string
        file_uuid:
          $ref: '#/components/schemas/UUIDSchema'
        unpack:
          type: boolean
        replace:
          type: boolean
        merge:
          type: boolean
        handle:
          type: string
        offset:
          type: integer
          format: int64
        size:
          type: integer
        options:
          type: object
          required: [patterns, globs, case, max_count, max_total, before, after]
          properties:
            patterns:
              type: array
              nullable: true
              items:
                type: string
            globs:
              type: array
              nullable: true
              items:
                type: string
            case:
              type: string
            max_count:
              type: integer
            max_total:
              type: integer
            before:
              type: integer
            after:
              type: integer

    EventDataFileUpload:
      type: object
      description: |
        Init emits this event once after publication or cleanup of an accepted
        upload. It is emitted even if the host disconnects or Finish loses its
        response. A rejected upload has only its inspect request/result pair.
        Success means publication finished. Error or cancellation can leave a
        partially applied merge, as specified by the upload endpoint.
        The event contains metadata only, uses spid=0, bypasses the stream size
        cap, and is flushed before shutdown. Recording does not extend the
        source file's TTL or guarantee its availability for future replay.
      required: [handle, file_uuid, path, unpack, replace, merge, bytes, status, error]
      properties:
        handle:
          type: string
        file_uuid:
          $ref: '#/components/schemas/UUIDSchema'
        path:
          type: string
          description: Clean absolute destination path.
        unpack:
          type: boolean
        replace:
          type: boolean
        merge:
          type: boolean
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Source bytes consumed from the upload pipe, including on failure.
            For an archive, counts compressed/source bytes, not extracted bytes.
            This is not a count of bytes successfully published to the destination.
        status:
          type: string
          enum: [success, error, cancelled, timeout]
        error:
          type: string
          nullable: true
          description: Error category only; null on success.

    EventDataInit:
      type: object
      description: |
        Operation-level startup snapshot.  `hostname`, `kernel`,
        `machine`, `boot_id` are best-effort — omitted if the
        environment couldn't provide them.
      required: [started_at, runtime_path, verbose, init_pid]
      properties:
        started_at:
          type: string
          format: date-time
          example: "2026-06-08T20:00:00.000000000Z"
        runtime_path:
          type: string
          description: Internal runtime directory for the operation.
          example: "/run/contreeinitd"
        verbose:
          type: boolean
          example: false
        init_pid:
          type: integer
          description: PID of the operation's init process.
          example: 1
        hostname:
          type: string
          example: "vm-abc123"
        kernel:
          type: string
          description: "uname release + version, space-separated."
          example: "6.10.0-generic #1 SMP PREEMPT"
        machine:
          type: string
          example: "x86_64"
        boot_id:
          type: string
          description: "Operation-unique boot identifier."
          example: "5e0a3f24-7c2d-4f50-8e1d-9b3c8d7e6a4f"

    EventDataSpawn:
      type: object
      description: |
        Process spawn parameters.  `env` values for keys ending in
        TOKEN/SECRET/PASSWORD/API_KEY/CREDENTIALS/AUTHORIZATION are
        replaced with the literal string `<MASKED>` before emission.
      required: [pid, command, args, shell, cwd, uid, gid, timeout, truncate_at]
      properties:
        resources_limits:
          $ref: '#/components/schemas/ProcessResourcesLimits'
        cpu_affinity:
          type: array
          items:
            type: integer
            minimum: 0
          description: Effective guest vCPU IDs available to this process tree.
        pid:
          type: integer
          minimum: 1
          description: PID assigned to the process.
          example: 4242
        command:
          type: string
          example: "/bin/sh"
        args:
          type: array
          items:
            type: string
          example: ["-c", "echo hi"]
        shell:
          type: boolean
          description: |
            If true, the command is wrapped in `<shell> -c <command>`
            (so the args / command may differ from the user's input).
          example: true
        cwd:
          type: string
          example: "/work"
        uid:
          type: integer
          example: 1000
        gid:
          type: integer
          example: 1000
        timeout:
          type: integer
          description: Per-process SIGKILL deadline in seconds.
          example: 60
        truncate_at:
          type: integer
          description: |
            Per-stream cap (bytes) above which stdout/stderr/stdin
            chunks stop being emitted and the stream's `truncated`
            event fires on EOF.
          example: 1048576
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Environment as passed to the process.  Values for
            secret-suffix keys are replaced with `<MASKED>`.
          example:
            PATH: "/usr/bin:/bin"
            DATABASE_PASSWORD: "<MASKED>"

    EventDataStream:
      type: object
      description: |
        Payload for `stdin` / `stdout` / `stderr` events.  Encoding
        is `ascii` when every byte is printable plus `\\n` / `\\r`
        / `\\t`; `base64` otherwise.  Chunks are at most a few KB
        each — the natural read granularity from a pipe.
      required: [value, encoding]
      properties:
        value:
          type: string
          example: "hello world\n"
        encoding:
          type: string
          enum: [ascii, base64]
          example: "ascii"
        truncated:
          type: boolean
          description: |
            Always `false` on per-chunk stream events.  When a stream
            crosses its per-stream cap a separate `truncated`-type
            event is emitted on EOF carrying the cumulative
            emitted/dropped totals.
          example: false

    EventDataExit:
      type: object
      description: |
        Process lifecycle close-out.  Carries the exit code OR the
        kill signal (signal = -1 means normal exit), the `timed_out`
        flag (true only when the process's per-process timeout fired
        — distinguishes from an external signal/kill), wall-clock
        duration, and a snapshot of resource usage.
      required: [pid, code, signal, timed_out, duration_ms, resources]
      properties:
        oom_killed:
          type: boolean
          default: false
          description: An OOM kill was observed in this process tree. Missing in older events.
        pid:
          type: integer
          minimum: 1
          description: PID of the process that just exited.
          example: 4242
        code:
          type: integer
          description: Exit code (0..255) if the process exited normally; -1 if killed by signal.
          example: 0
        signal:
          type: integer
          description: Signal number if killed by signal; -1 if normal exit.
          example: -1
        core_dump:
          type: boolean
          description: |
            True when the terminating signal produced a core dump.
            Absent in events recorded before the field was added —
            treat missing as false.
          example: false
        timed_out:
          type: boolean
          description: |
            True only if the process's own timeout fired the kill.
            An externally-driven kill (`signal` / `kill` / cancel)
            leaves `timed_out=false`.
          example: false
        duration_ms:
          type: integer
          format: int64
          description: Wall-clock time from spawn to exit.
          example: 1234
        resources:
          $ref: '#/components/schemas/EventResources'

    EventResources:
      type: object
      description: |
        Resource usage snapshot for the process.  Time fields are
        in microseconds; memory in kilobytes (max_rss_kb) or
        platform-specific units (shared_memory / unshared_memory).
        Some kernels populate fewer fields than others; expect
        zeroes for unsupported counters.
      required:
        - user_time_us
        - sys_time_us
        - max_rss_kb
        - shared_memory
        - unshared_memory
        - swaps
        - minor_faults
        - major_faults
        - voluntary_ctx_switches
        - involuntary_ctx_switches
        - block_input_ops
        - block_output_ops
        - ipc_msgs_sent
        - ipc_msgs_received
        - signals_received
      properties:
        user_time_us:
          type: integer
          format: int64
        sys_time_us:
          type: integer
          format: int64
        max_rss_kb:
          type: integer
          format: int64
        shared_memory:
          type: integer
          format: int64
        unshared_memory:
          type: integer
          format: int64
        swaps:
          type: integer
          format: int64
        minor_faults:
          type: integer
          format: int64
        major_faults:
          type: integer
          format: int64
        voluntary_ctx_switches:
          type: integer
          format: int64
        involuntary_ctx_switches:
          type: integer
          format: int64
        block_input_ops:
          type: integer
          format: int64
        block_output_ops:
          type: integer
          format: int64
        ipc_msgs_sent:
          type: integer
          format: int64
        ipc_msgs_received:
          type: integer
          format: int64
        signals_received:
          type: integer
          format: int64

    EventDataTruncated:
      type: object
      description: |
        Per-stream summary emitted once on stream EOF when the
        stream's `truncate_at` cap was crossed during its lifetime.
        Carries the final cumulative emitted/dropped totals (not
        partial numbers at cap-hit time).  Absent if the stream
        never crossed the cap.
      required: [stream, bytes_emitted, bytes_dropped]
      properties:
        stream:
          type: string
          enum: [stdin, stdout, stderr]
          example: "stdout"
        bytes_emitted:
          type: integer
          format: int64
          description: Bytes that were delivered before the cap kicked in.
          example: 1048576
        bytes_dropped:
          type: integer
          format: int64
          description: Bytes consumed from the producer but suppressed by the cap.
          example: 4096

    EventDataSizeCap:
      type: object
      description: |
        Emitted at most once per operation when the cumulative
        event-log size approached its budget.  After this marker,
        further stream events (`stdin` / `stdout` / `stderr`) are
        dropped; service events continue so the lifecycle stays
        observable.
      required: [limit_bytes, file_size]
      properties:
        limit_bytes:
          type: integer
          format: int64
          description: Size budget at which dropping kicked in.
          example: 104857600
        file_size:
          type: integer
          format: int64
          description: Approximate cumulative event-log size at cap-hit.
          example: 104800000

    EventDataNetwork:
      type: object
      description: |
        Per-interface counters plus the configured network state.
        Emitted once at the end of the network setup phase, so the
        counters represent the initial baseline.  Absent entirely
        for network-less operations.
      required: [interfaces]
      properties:
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInterface'
        configured:
          type: object
          description: |
            Subset of network params that were applied — empty keys
            are omitted, so the object only carries what was
            requested.
          properties:
            ip4:
              type: string
              example: "10.0.0.5/24"
            ip4_gw:
              type: string
              example: "10.0.0.1"
            ip6:
              type: string
              example: "fc10:c0::33/64"
            ip6_gw:
              type: string
              example: "fc10:c0::1"
            gw_mac:
              type: string
              description: "Gateway MAC address."
              example: "ee:d0:a7:48:b5:98"
            nameserver:
              type: string
              example: "8.8.8.8"
          additionalProperties: false
        error:
          type: string
          description: |
            Set if the per-interface counter read failed;
            `interfaces` then holds an empty list.  Best-effort —
            failure does not block shutdown.

    NetworkInterface:
      type: object
      required:
        - name
        - rx_bytes
        - rx_packets
        - rx_errs
        - rx_drop
        - tx_bytes
        - tx_packets
        - tx_errs
        - tx_drop
      properties:
        name:
          type: string
          example: "eth0"
        rx_bytes:
          type: integer
          format: int64
        rx_packets:
          type: integer
          format: int64
        rx_errs:
          type: integer
          format: int64
        rx_drop:
          type: integer
          format: int64
        tx_bytes:
          type: integer
          format: int64
        tx_packets:
          type: integer
          format: int64
        tx_errs:
          type: integer
          format: int64
        tx_drop:
          type: integer
          format: int64

    EventDataShutdown:
      type: object
      description: |
        Stream-terminating marker emitted right before the operation
        winds down.  Distinct from the `network` event so consumers
        can recognize a clean shutdown without parsing payload-
        specific data.
      required: [stopped_at, reason]
      properties:
        stopped_at:
          type: string
          format: date-time
          example: "2026-06-08T20:01:34.567890123Z"
        reason:
          type: string
          enum: [job_complete, timeout, spawn_failed, signal]
          description: |
            Short categorical reason for the shutdown:
              * `job_complete` — process exited normally;
              * `timeout` — the operation timeout fired;
              * `spawn_failed` — the process couldn't be started;
              * `signal` — terminated by an external signal.
            Additional categories may be added.

    EventDataCompletion:
      type: object
      description: |
        Terminal system-event payload, emitted once when the
        operation reaches one of `SUCCESS`, `FAILED`, `CANCELLED`.
        Carries the operation outcome and rollup counters for the
        log + image artifacts.  Always the last event in the log;
        the event itself has no `spid` (operation-scoped, not
        process-scoped).
      required: [status, duration_ms]
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED, CANCELLED]
          description: Terminal operation status.
        result_image_uuid:
          type: string
          format: uuid
          nullable: true
          description: |
            UUID of the result image the operation produced.
            Present on every SUCCESS that persists an image — for
            runs that wrote no new layer, this is the image UUID the
            operation was spawned from (per the spec).  Distinct
            from the spec uuid only when persist produced a new
            image.  ``null`` for disposable runs (no image was
            persisted at all) and for FAILED / CANCELLED outcomes.
          example: "019eef27-7ecb-7771-8184-aaf5fa596ce2"
        error:
          type: string
          nullable: true
          description: |
            Short human-readable error message when ``status`` is
            ``FAILED`` or ``CANCELLED``.  ``null`` on success.
          example: "spawn failed: exec /run/entrypoint: no such file"
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          description: Wall-clock duration of the handler in milliseconds.
          example: 4327
        image_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Size of the result image's runtime layer in bytes.
            ``0`` for failed/cancelled operations and for
            disposables (no image persisted).
          example: 134217728
        consumed_cpu:
          type: number
          nullable: true
          description: Total CPU time consumed by the operation, in seconds; null when unmeasured.
        consumed_memory:
          type: integer
          nullable: true
          description: Peak resident memory used by the operation's execution environment, in KiB; null when unmeasured.

security:
  - IAMBearerAuth: [ ]
    IAMProjectHeader: [ ]
