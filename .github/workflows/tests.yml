name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.14"
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    # codegen runs exactly once, on one Python: all packages are
    # generated and gated here. Python and JavaScript are packaged as
    # a wheel and npm tarball. Go output is checked against committed
    # sources. Other jobs do not need the CONTREE_SPEC secret.
    name: Generate and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTREE_SPEC: ${{ secrets.CONTREE_SPEC }}
    outputs:
      built: ${{ steps.flag.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.DEFAULT_PYTHON }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          uv sync
          npm ci --prefix client-js --no-audit --no-fund

      - name: Report spec availability
        id: flag
        # forks and external PRs get no secrets: downstream jobs then
        # run only the offline parts
        run: echo "built=${{ env.CONTREE_SPEC != '' }}" >> "$GITHUB_OUTPUT"

      - name: Generate the client packages
        if: env.CONTREE_SPEC != ''
        run: |
          uv run python -m api_generator --package client/contree_client
          uv run python -m api_generator --lang js --package client-js/lib
          uv run python -m api_generator --lang go

      - name: Verify committed Go sources are current
        if: env.CONTREE_SPEC != ''
        run: >-
          git diff --exit-code --
          go/v1/models.gen.go go/v1/operations.gen.go go/v1/spec_info.gen.go
          go/v1/testing.gen.go

      - name: Type check the generated client
        # from client/ so its pyproject applies: python-version 3.10
        # and respect-ignore-files=false (the generated package is
        # gitignored - ty would otherwise scan zero files)
        if: env.CONTREE_SPEC != ''
        run: cd client && uv run --project .. ty check contree_client

      - name: Run the codegen test suite
        # spec-dependent by design: loader, IR, emitters, the wheel
        # gate (builds a wheel and imports it from an isolated env).
        # Linux-only on purpose - codegen runs nowhere else.
        if: env.CONTREE_SPEC != ''
        run: uv run pytest -v --tb=short codegen/tests

      - name: Build the packages
        if: env.CONTREE_SPEC != ''
        run: |
          uv build client --out-dir dist
          cd client-js && npm pack --pack-destination ../dist

      - name: Upload the Python distribution
        if: env.CONTREE_SPEC != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload the npm tarball
        if: env.CONTREE_SPEC != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-js
          path: dist/*.tgz
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.DEFAULT_PYTHON }}

      - name: Install dependencies
        run: uv sync

      - name: Ruff format
        run: uv run ruff format --check codegen client/tests client-js/test go/tests conftest.py

      - name: Ruff check
        run: uv run ruff check codegen client/tests client-js/test go/tests conftest.py

      - name: Run ty (codegen)
        run: uv run ty check codegen/api_generator

  test-go:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.27.x"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Check and test committed Go sources
        run: make lint-go test-go

  test-python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Download the Python distribution
        if: needs.build.outputs.built == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-python
          path: dist

      - name: Install the built wheel into a clean environment
        # NOT `uv sync`: the workspace would substitute the editable
        # source member for the wheel. A standalone venv gets the
        # exact artifact plus its own [dev] extra (pytest & friends);
        # the incomplete source package is removed so nothing shadows
        # the wheel
        if: needs.build.outputs.built == 'true'
        run: |
          rm -rf client/contree_client .venv
          uv venv --python ${{ matrix.python-version }}
          uv pip install "$(ls dist/*.whl)[dev]"

      - name: Run tests
        if: needs.build.outputs.built == 'true'
        run: >
          uv run --no-project pytest -v --tb=short --timeout 300
          -m "not integration" client docs

  test-js:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "18" resolves to the latest 18.x: early 18.x test runners
        # never fire the root after() hook and their undici errors on
        # truncated gzip - the library itself still supports >=18.17
        node-version: ["18", "20", "22", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        # the node suites spawn the stdlib-only python stub server
        run: |
          uv python install ${{ env.DEFAULT_PYTHON }}
          echo "PYTHON=$(uv python find ${{ env.DEFAULT_PYTHON }})" >> "$GITHUB_ENV"

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --prefix client-js --no-audit --no-fund

      - name: Download the npm tarball
        if: needs.build.outputs.built == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-js
          path: dist

      - name: Unpack the built tarball
        # the tests then exercise the exact packed bytes
        if: needs.build.outputs.built == 'true'
        run: |
          tar -xzf dist/*.tgz
          rm -rf client-js/lib
          mv package/lib client-js/lib

      - name: Run tests
        # the shell expands the glob: node itself only learned to in
        # recent releases
        if: needs.build.outputs.built == 'true'
        run: cd client-js && node --test test/*.test.mjs

      - name: Strict type check
        if: needs.build.outputs.built == 'true'
        run: cd client-js && npx tsc --noEmit && npx prettier --check lib test

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CONTREE_SPEC: ${{ secrets.CONTREE_SPEC }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.DEFAULT_PYTHON }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          uv sync
          npm ci --prefix client-js --no-audit --no-fund

      - name: Build documentation (HTML + Mintlify)
        # self-contained: autodoc imports the generated package and
        # the JS reference page is emitted next to it, so this job
        # generates from the spec itself
        if: env.CONTREE_SPEC != ''
        run: make docs docs-mintlify

      - name: Require the specification for publication
        if: github.ref == 'refs/heads/master'
        run: test -n "$CONTREE_SPEC"

      - name: Upload GitHub Pages artifact
        if: env.CONTREE_SPEC != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  pages:
    name: Publish documentation
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  integration:
    name: Integration (live API, python + js + go)
    # One job for all three languages, Linux only, independent of the unit
    # matrices (runs in parallel with them). These tests perform WRITE
    # operations (upload, spawn, cancel) against the
    # endpoint in the CONTREE_URL secret - never point it at
    # production. The token allows only 8 concurrent runs and 1
    # concurrent import, so live runs are serialized repository-wide:
    # the concurrency group is a semaphore of exactly one.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    concurrency:
      group: contree-live-api
      cancel-in-progress: false
    env:
      CONTREE_TOKEN: ${{ secrets.CONTREE_TOKEN }}
      CONTREE_URL: ${{ secrets.CONTREE_URL }}
      CONTREE_PROJECT: ${{ secrets.CONTREE_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.DEFAULT_PYTHON }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci --prefix client-js --no-audit --no-fund

      - name: Download the distributions
        if: needs.build.outputs.built == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install the built artifacts
        # a standalone venv, not `uv sync`: the workspace would
        # substitute the editable source member for the wheel
        if: needs.build.outputs.built == 'true'
        run: |
          rm -rf client/contree_client .venv
          uv venv --python ${{ env.DEFAULT_PYTHON }}
          uv pip install "$(ls dist/*.whl)[dev]"
          tar -xzf dist/*.tgz
          rm -rf client-js/lib
          mv package/lib client-js/lib

      - name: Set up Go
        if: needs.build.outputs.built == 'true' && env.CONTREE_TOKEN != ''
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Run Python integration tests
        if: needs.build.outputs.built == 'true' && env.CONTREE_TOKEN != ''
        run: >
          uv run --no-project pytest -c pyproject.toml -v -rs --tb=short --timeout 300
          -m integration client

      - name: Run JS integration tests
        if: needs.build.outputs.built == 'true' && env.CONTREE_TOKEN != ''
        run: >
          uv run --no-project pytest -c pyproject.toml -v -rs --tb=short --timeout 300
          -m integration client-js/test

      - name: Run Go integration tests
        if: needs.build.outputs.built == 'true' && env.CONTREE_TOKEN != ''
        run: >
          uv run --no-project pytest -c pyproject.toml -v -rs --tb=short --timeout 300
          -m integration go/tests
